name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Automated Unit Testing & Production Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Backend Server Dependencies
        run: |
          cd server
          npm ci

      - name: Execute Server Automated Test Suite (95/95 Tests)
        run: |
          cd server
          npm test

      - name: Install Client Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Compile Frontend Production Build (Vite & PWA)
        run: |
          cd client
          npm run build
